{% extends 'main/base.html' %}

{% block content %}

<div class="auth-box">
    <h1>Кирүү</h1>
    <p>Аккаунтуңузга кириңиз</p>

    <form method="post">
        {% csrf_token %}

        <div class="form-fields">
            {{ form.as_p }}
        </div>

        <button type="submit" class="btn btn-blue auth-btn">Кирүү</button>
    </form>

    <div class="auth-bottom">
        <span>Аккаунтуңуз жокпу?</span>
        <a href="{% url 'register' %}">Катталуу</a>
    </div>
</div>

{% endblock %}
